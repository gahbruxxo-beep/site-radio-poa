<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel de pedidos</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>Painel de pedidos e recados</header>
<main style="max-width: 760px; margin: 0 auto; padding: 24px 20px 60px;">
  <form id="login">
    <input type="password" id="senha" placeholder="Senha do painel" autocomplete="current-password">
    <button type="submit">Entrar</button>
    <span id="erro" class="erro"></span>
  </form>
  <div id="area" hidden>
    <div class="barra" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px;">
      <button class="sec" id="atualizar" type="button">Atualizar lista</button>
      <button class="sec" id="sair" type="button">Sair</button>
      <span id="contagem"></span>
      <div class="admin-stat-card">
        <h3>Ouvintes Ao Vivo</h3>
        <span id="playerOuvintes" class="admin-numero">0</span>
      </div>
    </div>
    <div id="lista"></div>
  </div>
</main>
<script src="/admin.js"></script>
</body>
</html>
